name: Build & Release Binaries

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'server/templates/**'
      - 'client/config.yaml.example'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-OS Binaries & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Build Binaries & Package Archives
        run: |
          mkdir -p release_assets

          # 1. Windows amd64
          echo "Building for Windows amd64..."
          (cd server && GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o cert-server.exe .)
          (cd client && GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o cert-agent.exe .)
          zip -j release_assets/cert-server-windows-amd64.zip server/cert-server.exe client/config.yaml.example
          zip -j release_assets/cert-agent-windows-amd64.zip client/cert-agent.exe client/config.yaml.example

          # 2. Linux amd64
          echo "Building for Linux amd64..."
          (cd server && GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o cert-server .)
          (cd client && GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o cert-agent .)
          tar -czvf release_assets/cert-server-linux-amd64.tar.gz -C server cert-server -C ../client config.yaml.example
          tar -czvf release_assets/cert-agent-linux-amd64.tar.gz -C client cert-agent -C ../client config.yaml.example

          # 3. Linux arm64
          echo "Building for Linux arm64..."
          (cd server && GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cert-server-arm64 .)
          (cd client && GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cert-agent-arm64 .)
          tar -czvf release_assets/cert-server-linux-arm64.tar.gz -C server cert-server-arm64 -C ../client config.yaml.example
          tar -czvf release_assets/cert-agent-linux-arm64.tar.gz -C client cert-agent-arm64 -C ../client config.yaml.example

      - name: Generate Dynamic Release Tag
        id: release_tag
        run: |
          DATE_STR=$(date +'%d%m%Y')
          TAG_NAME="${DATE_STR}"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "DOCKER_TAG=${DATE_STR}" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body: |
            Automated production binary release for **Cert Deployer** (Cert Server & Cert Agent).

            ### 📦 Binaries Included
            Includes Cert Server & Cert Agent binaries compiled for Windows (amd64) and Linux (amd64, arm64), pre-packaged with sample `config.yaml.example`:
            - `cert-server-windows-amd64.zip`
            - `cert-agent-windows-amd64.zip`
            - `cert-server-linux-amd64.tar.gz`
            - `cert-agent-linux-amd64.tar.gz`
            - `cert-server-linux-arm64.tar.gz`
            - `cert-agent-linux-arm64.tar.gz`

            ### 🐳 Corresponding Docker Hub Image
            - **Docker Image**: `h2372/cert-deployer:${{ env.DOCKER_TAG }}`
            - **Latest Image**: `h2372/cert-deployer:latest`
            - **Supported Architectures**: `linux/amd64`, `linux/arm64`
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
