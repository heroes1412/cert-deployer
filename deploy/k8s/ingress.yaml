apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cert-server-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: cert-server.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cert-server-service
                port:
                  number: 8080
  tls:
    - hosts:
        - cert-server.example.com
      secretName: cert-server-tls-secret
